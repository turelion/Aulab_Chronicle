<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">

<head th:replace="~{index :: head}"></head>

<body>

    <!-- Navbar -->
    <nav th:replace="~{index :: navbar}"></nav>

    <main class="container min-vh-100 my-5">

        <!-- MESSAGGIO DI SUCCESSO -->
        <div th:if="${successMessage}"
            class="alert alert-success alert-dismissible fade show border-0 bg-success text-white mb-4" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- HEADER DASHBOARD -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
                <h2 class="fw-bold text-white mb-1">
                    <i class="fa-solid fa-feather-pointed text-warning me-2"></i>Dashboard Redattore
                </h2>
                <p class="text-white-50 mb-0">Gestisci i tuoi articoli, controlla lo stato delle revisioni o creane di
                    nuovi.</p>
            </div>
            <a th:href="@{/articles/create}" class="btn btn-aulab">
                <i class="fa-solid fa-plus me-1"></i> Crea Nuovo Articolo
            </a>
        </div>

        <!-- TABELLA ARTICOLI SCURA -->
        <div class="card-dashboard p-3 p-md-4">
            <div class="table-responsive">
                <table class="table table-aulab align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col" style="width: 80px;">ID</th>
                            <th scope="col">TITOLO</th>
                            <th scope="col" class="text-center" style="width: 160px;">STATO</th>
                            <th scope="col" class="text-end" style="width: 180px;">AZIONI</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="article : ${articles}">
                            <td class="fw-bold text-white-50" th:text="${'#' + article.id}">#1</td>
                            <td>
                                <span class="fw-semibold text-white d-block" th:text="${article.title}">Titolo
                                    dell'articolo</span>
                            </td>
                            <td class="text-center">
                                <!-- ACCETTATO: Distinguiamo se è già pubblicato o programmato -->
                                <th:block th:if="${article.isAccepted == true}">
                                    <!-- Programmato (Data futura) -->
                                    <span
                                        th:if="${article.publishDate != null and article.publishDate.isAfter(T(java.time.LocalDate).now())}"
                                        class="badge-status status-success"
                                        th:title="${'Verrà pubblicato il ' + #temporals.format(article.publishDate, 'dd/MM/yyyy')}">
                                        <span class="status-dot"></span> Programmato
                                    </span>

                                    <!-- Pubblicato (Data odierna o passata) -->
                                    <span
                                        th:unless="${article.publishDate != null and article.publishDate.isAfter(T(java.time.LocalDate).now())}"
                                        class="badge-status status-success">
                                        <span class="status-dot"></span> Pubblicato
                                    </span>
                                </th:block>

                                <!-- RIFIUTATO -->
                                <span th:if="${article.isAccepted == false}" class="badge-status status-danger">
                                    <span class="status-dot"></span> Rifiutato
                                </span>

                                <!-- IN REVISIONE -->
                                <span th:if="${article.isAccepted == null}" class="badge-status status-warning">
                                    <span class="status-dot"></span> In Revisione
                                </span>
                            </td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-1">
                                    <a th:href="@{/articles/detail/{id}(id=${article.id})}"
                                        class="btn btn-sm btn-outline-aulab" title="Leggi">
                                        <i class="fa-regular fa-eye"></i>
                                    </a>
                                    <a th:href="@{/articles/edit/{id}(id=${article.id})}"
                                        class="btn btn-sm btn-outline-warning" title="Modifica">
                                        <i class="fa-solid fa-pen"></i>
                                    </a>
                                    <a th:href="@{/articles/delete/{id}(id=${article.id})}"
                                        class="btn btn-sm btn-outline-danger" title="Elimina"
                                        onclick="return confirm('Sei sicuro di voler eliminare l\'articolo?');">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>

                        <!-- EMPTY STATE SE NON CI SONO ARTICOLI -->
                        <tr th:if="${#lists.isEmpty(articles)}">
                            <td colspan="4" class="text-center py-5 text-white-50">
                                <i class="fa-solid fa-newspaper fs-1 mb-3 text-white-50 d-block"></i>
                                Non hai ancora scritto alcun articolo. Clicca su "Crea Nuovo Articolo" per iniziare!
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer th:replace="~{index :: footer}"></footer>

    <!-- Bootstrap Script -->
    <div th:replace="~{index :: bootstrapScript}"></div>
</body>

</html>
