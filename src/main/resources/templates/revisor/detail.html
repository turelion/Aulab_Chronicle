<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">

<head th:replace="~{index :: head}"></head>

<body>

    <!-- Navbar -->
    <nav th:replace="~{index :: navbar}"></nav>

    <main class="container min-vh-100 my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-9">

                <!-- BARRA SUPERIORE / BACK -->
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <span class="badge-status status-warning">
                        <span class="status-dot"></span> In Revisione
                    </span>
                    <a th:href="@{/revisor/dashboard}" class="btn btn-outline-aulab btn-sm">
                        <i class="fa-solid fa-arrow-left me-1"></i> Dashboard Revisore
                    </a>
                </div>

                <!-- CARD ARTICOLO -->
                <div class="form-card p-4 p-md-5 mb-4">

                    <!-- TITOLO & SOTTOTITOLO -->
                    <h1 th:text="${article.title}" class="fw-bold text-white mb-3">Titolo dell'Articolo</h1>
                    <h5 th:text="${article.subtitle}" class="text-white-50 fw-normal mb-4">Sottotitolo o estratto breve
                        dell'articolo...</h5>

                    <!-- CATEGORIA & METADATI -->
                    <div class="d-flex align-items-center gap-3 pb-4 mb-4 border-bottom border-secondary">
                        <span class="badge bg-secondary bg-opacity-20 text-light border border-secondary px-3 py-2"
                            th:text="${article.category != null ? article.category.name : 'Uncategorized'}">
                            Categoria
                        </span>
                        <small class="text-white-50" th:if="${article.publishDate != null}">
                            <i class="fa-regular fa-calendar me-1"></i>
                            <span th:text="${#temporals.format(article.publishDate, 'dd/MM/yyyy')}">01/01/2026</span>
                        </small>
                    </div>

                    <!-- IMMAGINE DI COPERTINA -->
                    <div class="mb-5 text-center">
                        <img th:if="${article.image != null}" th:src="${article.image.path}"
                            class="article-detail-img shadow-sm" alt="Copertina Articolo">
                        <img th:unless="${article.image != null}" th:src="@{/images/default.jpg}"
                            class="article-detail-img shadow-sm" alt="Immagine Predefinita">
                    </div>

                    <!-- TESTO DELL'ARTICOLO -->
                    <div class="article-body text-light fs-5 lh-lg mb-4"
                        style="white-space: pre-line; overflow-wrap: break-word;" th:text="${article.body}">
                        Contenuto dell'articolo...
                    </div>

                    <!-- AZIONI DI REVISIONE (PULSANTI SOFT / MUTED) -->
                    <div
                        class="d-flex flex-column flex-sm-row justify-content-end gap-3 pt-4 border-top border-secondary">

                        <a th:href="@{/revisor/dashboard}" class="btn btn-outline-aulab px-4">
                            Annulla
                        </a>

                        <!-- RIFIUTA (Bordo e testo rosso muted) -->
                        <form th:action="@{/articles/accept(action='reject', articleId=${article.id})}" method="post">
                            <button type="submit" class="btn btn-outline-danger px-4 w-100"
                                onclick="return confirm('Sei sicuro di voler rifiutare questo articolo?');">
                                <i class="fa-solid fa-xmark me-2"></i> Rifiuta Articolo
                            </button>
                        </form>

                        <!-- ACCETTA (Bordo e testo verde muted) -->
                        <form th:action="@{/articles/accept(action='accept', articleId=${article.id})}" method="post">
                            <button type="submit" class="btn btn-outline-success px-4 w-100">
                                <i class="fa-solid fa-check me-2"></i> Accetta e Pubblica
                            </button>
                        </form>

                    </div>

                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{index :: footer}"></footer>

    <!-- Bootstrap Script -->
    <div th:replace="~{index :: bootstrapScript}"></div>
</body>

</html>
